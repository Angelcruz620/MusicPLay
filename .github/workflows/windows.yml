name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: ['desktop/windows-app']
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: MusicPLay-Windows-Installer
          path: dist/MusicPLay-Setup-*.exe
          if-no-files-found: error
